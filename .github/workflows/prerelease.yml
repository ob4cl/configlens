name: Beta prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag (vMAJOR.MINOR.PATCH-beta.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    # Visibility is deliberately NOT gated here. This workflow used to require a private repository,
    # which meant it silently stopped working the moment the project was published. What actually
    # makes a release trustworthy is enforced below instead: the tag must match the package version,
    # it must resolve to a commit that is an ancestor of the dispatch commit, CI re-runs against that
    # exact commit, and the publish job re-resolves the tag and requires it to equal that same SHA.
    # Keep the repository and ref checks: they stop a fork or an accidental branch dispatch.
    if: github.repository == 'ob4cl/configlens' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing reviewed beta tag
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { printf 'Invalid beta tag\n' >&2; exit 1; }
          # The tag and the package version must agree: the archive names, the git tag,
          # `configlens --version`, the report `tool_version` and the SBOM root component all
          # identify the release. The manifest is read straight out of the tag, so nothing is
          # checked out or executed here, and a mismatch fails before any build starts.
          tag_version="${TAG#v}"
          crate_version=$(git show "$TAG:Cargo.toml" | awk '
            /^\[/ { in_package = ($0 == "[package]") }
            in_package && /^version[[:space:]]*=/ { gsub(/^[^"]*"/, ""); gsub(/".*$/, ""); print; exit }
          ')
          [[ -n "$crate_version" ]] || { printf 'Cannot read the [package] version from %s\n' "$TAG" >&2; exit 1; }
          if [[ "$crate_version" != "$tag_version" ]]; then
            printf 'Tag/package version mismatch: %s requires package version %s, found %s\n' \
              "$TAG" "$tag_version" "$crate_version" >&2
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
    permissions:
      contents: read

  build:
    needs: [preflight, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Build native release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add --toolchain stable "$TARGET"
          cargo +stable build --locked --release --target "$TARGET" --bin configlens
      - name: Package binary and public project notices only
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: python scripts/package_release.py --tag "$TAG" --target "$TARGET" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sbom:
    name: SBOM (CycloneDX)
    needs: [preflight, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Install the pinned SBOM tool
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      # One CycloneDX 1.5 SBOM per release target, generated from the pinned dependency graph and
      # validated by scripts/generate_sbom.py (non-empty, every component carries a licence, no
      # builder paths, reproducible bytes). scripts/test_generate_sbom.py covers that contract.
      - name: Generate one SBOM per supported target
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            python scripts/generate_sbom.py --tag "$TAG" --target "$target" --output dist
          done
          shopt -s nullglob
          boms=( dist/*.cdx.json )
          [[ ${#boms[@]} == 3 ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [preflight, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist
          merge-multiple: true
      - name: Verify archives and create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Record visibility, but do not depend on it: the release is intended to work the same
          # whether the repository is private or public. Never change visibility here.
          printf 'repository visibility: %s\n' "$(gh api "repos/$GH_REPO" --jq 'if .private then "private" else "public" end')"
          # Resolve annotated or lightweight tags without cloning or running project code.
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")
          kind=$(jq -r .object.type <<< "$object")
          sha=$(jq -r .object.sha <<< "$object")
          while [[ "$kind" == tag ]]; do
            object=$(gh api "repos/$GH_REPO/git/tags/$sha")
            kind=$(jq -r .object.type <<< "$object")
            sha=$(jq -r .object.sha <<< "$object")
          done
          [[ "$kind" == commit && "$sha" == "$EXPECTED_SHA" ]]
          cd dist
          shopt -s nullglob
          archives=( *.tar.gz *.zip )
          sums=( *.sha256 )
          boms=( *.cdx.json )
          [[ ${#archives[@]} == 3 && ${#sums[@]} == 3 && ${#boms[@]} == 3 ]]
          for checksum in "${sums[@]}"; do sha256sum --check "$checksum"; done
          cat -- "${sums[@]}" > SHA256SUMS
          notes=$(printf 'Pre-release beta build; unsigned native binaries, no installer. Synthetic tests are not proof of upstream-client conformance.\n\nEach archive is accompanied by a CycloneDX 1.5 SBOM (configlens-<tag>-<target>.cdx.json) generated from the pinned dependency graph; the SBOM is a dependency inventory, not a signature.\n\nVerify before use:\n- macOS/Linux: sha256sum -c SHA256SUMS (macOS: shasum -a 256 -c)\n- Windows: Get-FileHash -Algorithm SHA256 <file> (compare with SHA256SUMS)\n- SBOM: any CycloneDX viewer, or read it as JSON\n\nNo automatic update or installation; nothing here contacts the network.')
          gh release create "$TAG" "${archives[@]}" "${boms[@]}" SHA256SUMS \
            --verify-tag --prerelease --latest=false --title "ConfigLens $TAG (pre-release beta)" \
            --notes "$notes"
          gh release view "$TAG" --json tagName,isPrerelease,isDraft,assets > release.json
          jq --exit-status --arg tag "$TAG" \
            '.tagName == $tag and .isPrerelease == true and .isDraft == false and (.assets | length) == 7' release.json
          jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}' release.json
