<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" role="img" aria-labelledby="title desc">
  <title id="title">ConfigLens</title>
  <desc id="desc">A magnifier inspecting three stacked configuration layers; the topmost accent layer is the one that wins.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="179" rx="20" fill="url(#bg)" stroke="#334155"/>

  <!-- three configuration layers; the accent layer on top is the winner -->
  <g transform="translate(56,60)">
    <rect x="0" y="26" width="140" height="15" rx="7.5" fill="#3f4c61"/>
    <rect x="11" y="0" width="140" height="15" rx="7.5" fill="#5b6b83"/>
    <rect x="22" y="-26" width="140" height="15" rx="7.5" fill="url(#accent)"/>
  </g>

  <!-- magnifier inspecting the stack -->
  <g fill="none" stroke="#e2e8f0" stroke-linecap="round">
    <circle cx="198" cy="60" r="31" stroke-width="5"/>
    <line x1="219" y1="81" x2="243" y2="105" stroke-width="9"/>
  </g>
  <circle cx="188" cy="50" r="8" fill="#38bdf8" opacity="0.30"/>

  <text x="300" y="88" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc" letter-spacing="0.5">ConfigLens</text>
  <text x="302" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Which configuration value wins — and why</text>
</svg>
